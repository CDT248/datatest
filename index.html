<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Hello</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        radial-gradient(
            circle at top,
            #1e293b,
            #0f172a 50%,
            #020617
        );

    font-family:
        Arial,
        sans-serif;

    color:white;

}

.container{

    text-align:center;

}


/* HELLO */

.hello{

    font-size:64px;

    font-weight:900;

    letter-spacing:5px;

    margin-bottom:25px;

    cursor:pointer;

}

.hello span{

    display:inline-block;

    animation:
        float 1.5s
        ease-in-out
        infinite;

}

.hello span:nth-child(1){
    animation-delay:0s;
}

.hello span:nth-child(2){
    animation-delay:.1s;
}

.hello span:nth-child(3){
    animation-delay:.2s;
}

.hello span:nth-child(4){
    animation-delay:.3s;
}

.hello span:nth-child(5){
    animation-delay:.4s;
}

.wave{

    margin-left:10px;

    animation:
        wave 1.3s
        ease-in-out
        infinite !important;

    transform-origin:
        70% 70%;

}


/* BUTTON */

.open-btn{

    display:inline-flex;

    justify-content:center;

    align-items:center;

    padding:
        14px
        32px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #8b5cf6
        );

    color:white;

    text-decoration:none;

    font-size:16px;

    font-weight:700;

    box-shadow:
        0 10px 30px
        rgba(56,189,248,.25);

    transition:.3s;

}

.open-btn:hover{

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 15px 40px
        rgba(139,92,246,.4);

}


/* LINE */

.line{

    width:180px;

    height:3px;

    margin:
        0 auto
        25px;

    border-radius:50px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #38bdf8,
            #a78bfa,
            #38bdf8,
            transparent
        );

    background-size:200% 100%;

    animation:
        lineMove 2s
        linear
        infinite;

}


/* ANIMATIONS */

@keyframes float{

    0%,
    100%{

        transform:
            translateY(0);

    }

    50%{

        transform:
            translateY(-12px);

    }

}


@keyframes wave{

    0%,
    100%{

        transform:
            rotate(0deg);

    }

    20%{

        transform:
            rotate(20deg);

    }

    40%{

        transform:
            rotate(-15deg);

    }

    60%{

        transform:
            rotate(20deg);

    }

    80%{

        transform:
            rotate(-5deg);

    }

}


@keyframes lineMove{

    0%{

        background-position:
            0% 50%;

    }

    100%{

        background-position:
            200% 50%;

    }

}


/* MOBILE */

@media(max-width:500px){

    .hello{

        font-size:45px;

    }

    .open-btn{

        padding:
            13px
            27px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- HELLO -->

    <a
        href="cod.html"
        style="
            text-decoration:none;
            color:inherit;
        "
    >

        <div class="hello">

            <span>H</span>
            <span>E</span>
            <span>L</span>
            <span>L</span>
            <span>O</span>

            <span class="wave">
                👋
            </span>

        </div>

    </a>


    <!-- ANIMATED LINE -->

    <div class="line"></div>


    <!-- OPEN BUTTON -->

    <a
        href="cod.html"
        class="open-btn"
    >

        🚀 Open

    </a>


</div>


</body>

</html>
