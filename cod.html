<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Device Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#07111f,#0d1b2a,#102a43);
    color:#fff;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:30px;
    margin-bottom:8px;
}

.header p{
    color:#aab7c4;
    font-size:14px;
}

.status{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    padding:12px 16px;
    border-radius:14px;
    margin-bottom:20px;
    text-align:center;
    font-size:14px;
}

.status span{
    font-weight:bold;
}

.online{
    color:#35e58c;
}

.offline{
    color:#ff6565;
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    padding:20px;
    backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.card-title{
    color:#9eabb9;
    font-size:13px;
    margin-bottom:9px;
}

.card-value{
    font-size:18px;
    font-weight:bold;
    word-break:break-word;
}

.location{
    grid-column:1/-1;
}

.controls{
    margin-top:20px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    padding:20px;
}

.controls h2{
    font-size:18px;
    margin-bottom:15px;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

select,
button{
    border:none;
    border-radius:12px;
    padding:13px 16px;
    font-size:14px;
    cursor:pointer;
}

select{
    background:#17283a;
    color:#fff;
    flex:1;
    min-width:180px;
    border:1px solid #30445a;
}

button{
    background:#168cff;
    color:white;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

button.stop{
    background:#e84c4c;
}

button.location-btn{
    background:#7c4dff;
}

.logs{
    margin-top:20px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    padding:20px;
}

.logs h2{
    font-size:18px;
    margin-bottom:12px;
}

#logBox{
    max-height:220px;
    overflow-y:auto;
}

.log{
    padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:13px;
    color:#c7d0d9;
}

.footer{
    text-align:center;
    color:#7f8b98;
    font-size:12px;
    margin-top:20px;
}

@media(max-width:600px){
    body{
        padding:12px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .location{
        grid-column:auto;
    }

    .header h1{
        font-size:25px;
    }

    .card{
        padding:17px;
    }

    button,
    select{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📱 Live Device Dashboard</h1>
        <p>Phone data monitoring & automatic Google Sheet sync</p>
    </div>

    <div class="status">
        Connection:
        <span id="connectionStatus" class="online">Checking...</span>
    </div>

    <div class="cards">

        <div class="card">
            <div class="card-title">📅 Date</div>
            <div class="card-value" id="date">--</div>
        </div>

        <div class="card">
            <div class="card-title">⏰ Time</div>
            <div class="card-value" id="time">--</div>
        </div>

        <div class="card">
            <div class="card-title">🌐 Public IP</div>
            <div class="card-value" id="ip">Loading...</div>
        </div>

        <div class="card">
            <div class="card-title">🔋 Battery</div>
            <div class="card-value" id="battery">Checking...</div>
        </div>

        <div class="card">
            <div class="card-title">🆔 Device ID</div>
            <div class="card-value" id="deviceId">--</div>
        </div>

        <div class="card location">
            <div class="card-title">📍 Location</div>
            <div class="card-value" id="location">
                Location not available
            </div>
        </div>

    </div>

    <div class="controls">

        <h2>⚙️ Auto Send Settings</h2>

        <div class="row">

            <select id="intervalSelect">

                <option value="1000">1 Second</option>
                <option value="2000">2 Seconds</option>
                <option value="3000">3 Seconds</option>
                <option value="4000">4 Seconds</option>
                <option value="5000" selected>5 Seconds</option>

                <option value="120000">2 Minutes</option>
                <option value="180000">3 Minutes</option>
                <option value="300000">5 Minutes</option>

            </select>

            <button onclick="sendNow()">
                🚀 Send Now
            </button>

            <button class="location-btn" onclick="getLocation()">
                📍 Get Location
            </button>

            <button class="stop" onclick="stopAutoSend()">
                ⛔ Stop Auto
            </button>

        </div>

    </div>

    <div class="logs">

        <h2>📋 Activity Log</h2>

        <div id="logBox"></div>

    </div>

    <div class="footer">
        Live Device Data System
    </div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzFJbVAZxXgj1EdOo5LvIvBzJmyUDk4gE3f5GtG60Ayfaod1qbRRAKWCebOe_sxsKvJ/exec";


/* =========================================================
   DEVICE ID
   ========================================================= */

let deviceId = localStorage.getItem("phone_device_id");

if(!deviceId){

    deviceId =
        "PHONE-" +
        Date.now().toString(36).toUpperCase() +
        "-" +
        Math.random().toString(36).substring(2,8).toUpperCase();

    localStorage.setItem("phone_device_id",deviceId);
}

document.getElementById("deviceId").textContent = deviceId;


/* =========================================================
   VARIABLES
   ========================================================= */

let publicIP = "Unknown";
let latitude = "";
let longitude = "";
let locationText = "Location not available";

let batteryLevel = "Unknown";

let autoTimer = null;


/* =========================================================
   DATE & TIME
   ========================================================= */

function updateDateTime(){

    const now = new Date();

    const date =
        String(now.getDate()).padStart(2,"0") +
        "-" +
        String(now.getMonth()+1).padStart(2,"0") +
        "-" +
        now.getFullYear();

    const time =
        String(now.getHours()).padStart(2,"0") +
        ":" +
        String(now.getMinutes()).padStart(2,"0") +
        ":" +
        String(now.getSeconds()).padStart(2,"0");

    document.getElementById("date").textContent = date;
    document.getElementById("time").textContent = time;
}

setInterval(updateDateTime,1000);

updateDateTime();


/* =========================================================
   INTERNET STATUS
   ========================================================= */

function updateConnection(){

    const el =
        document.getElementById("connectionStatus");

    if(navigator.onLine){

        el.textContent = "Online";
        el.className = "online";

    }else{

        el.textContent = "Offline";
        el.className = "offline";
    }
}

window.addEventListener("online",updateConnection);
window.addEventListener("offline",updateConnection);

updateConnection();


/* =========================================================
   GET PUBLIC IP
   ========================================================= */

async function getIP(){

    try{

        const response =
            await fetch(
                "https://api.ipify.org?format=json",
                {cache:"no-store"}
            );

        const data = await response.json();

        publicIP = data.ip || "Unknown";

        document.getElementById("ip").textContent =
            publicIP;

    }catch(error){

        publicIP = "Unknown";

        document.getElementById("ip").textContent =
            "Unavailable";

        addLog("❌ IP address could not be loaded");
    }
}

getIP();


/* =========================================================
   BATTERY
   ========================================================= */

async function getBattery(){

    try{

        if(!navigator.getBattery){

            batteryLevel = "Not Supported";

            document.getElementById("battery").textContent =
                batteryLevel;

            return;
        }

        const battery =
            await navigator.getBattery();

        function updateBattery(){

            batteryLevel =
                Math.round(battery.level * 100) + "%";

            if(battery.charging){

                batteryLevel += " ⚡";
            }

            document.getElementById("battery").textContent =
                batteryLevel;
        }

        updateBattery();

        battery.addEventListener(
            "levelchange",
            updateBattery
        );

        battery.addEventListener(
            "chargingchange",
            updateBattery
        );

    }catch(error){

        batteryLevel = "Unknown";

        document.getElementById("battery").textContent =
            batteryLevel;
    }
}

getBattery();


/* =========================================================
   GET LOCATION
   ========================================================= */

function getLocation(){

    if(!navigator.geolocation){

        addLog("❌ Geolocation is not supported");

        return;
    }

    addLog("📍 Requesting location permission...");

    navigator.geolocation.getCurrentPosition(

        function(position){

            latitude =
                position.coords.latitude;

            longitude =
                position.coords.longitude;

            locationText =
                latitude + ", " + longitude;

            document.getElementById("location").textContent =
                locationText;

            addLog(
                "✅ Location received: " +
                latitude +
                ", " +
                longitude
            );
        },

        function(error){

            if(error.code === 1){

                addLog(
                    "❌ Location permission denied"
                );

            }else if(error.code === 2){

                addLog(
                    "❌ Location unavailable"
                );

            }else if(error.code === 3){

                addLog(
                    "❌ Location request timeout"
                );

            }else{

                addLog(
                    "❌ Location error"
                );
            }
        },

        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }
    );
}


/* =========================================================
   COLLECT DATA
   ========================================================= */

function collectData(){

    const now = new Date();

    const date =
        String(now.getDate()).padStart(2,"0") +
        "-" +
        String(now.getMonth()+1).padStart(2,"0") +
        "-" +
        now.getFullYear();

    const time =
        String(now.getHours()).padStart(2,"0") +
        ":" +
        String(now.getMinutes()).padStart(2,"0") +
        ":" +
        String(now.getSeconds()).padStart(2,"0");

    return {

        date: date,

        time: time,

        ip: publicIP,

        location: locationText,

        latitude: latitude,

        longitude: longitude,

        battery: batteryLevel,

        deviceId: deviceId
    };
}


/* =========================================================
   SEND DATA TO GOOGLE SHEET
   ========================================================= */

async function sendNow(){

    const data = collectData();

    addLog(
        "📤 Sending data..."
    );

    try{

        await fetch(
            API_URL,
            {
                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(data)
            }
        );

        addLog(
            "✅ Data request sent successfully"
        );

    }catch(error){

        addLog(
            "❌ Send failed: " +
            error.message
        );
    }
}


/* =========================================================
   AUTO SEND
   ========================================================= */

function startAutoSend(){

    stopAutoSend();

    const select =
        document.getElementById("intervalSelect");

    const interval =
        Number(select.value);

    const text =
        select.options[
            select.selectedIndex
        ].text;

    addLog(
        "🔄 Auto Send started: " +
        text
    );

    /* প্রথমবার সাথে সাথে পাঠাবে */

    sendNow();

    /* তারপর selected interval অনুযায়ী */

    autoTimer =
        setInterval(
            sendNow,
            interval
        );
}


/* =========================================================
   STOP AUTO SEND
   ========================================================= */

function stopAutoSend(){

    if(autoTimer){

        clearInterval(autoTimer);

        autoTimer = null;

        addLog(
            "⛔ Auto Send stopped"
        );
    }
}


/* =========================================================
   INTERVAL CHANGE
   ========================================================= */

document
.getElementById("intervalSelect")
.addEventListener(
    "change",
    function(){

        if(autoTimer){

            startAutoSend();

        }else{

            const text =
                this.options[
                    this.selectedIndex
                ].text;

            addLog(
                "⚙️ Interval selected: " +
                text
            );
        }
    }
);


/* =========================================================
   ACTIVITY LOG
   ========================================================= */

function addLog(message){

    const box =
        document.getElementById("logBox");

    const item =
        document.createElement("div");

    item.className = "log";

    const now = new Date();

    const time =
        String(now.getHours()).padStart(2,"0") +
        ":" +
        String(now.getMinutes()).padStart(2,"0") +
        ":" +
        String(now.getSeconds()).padStart(2,"0");

    item.textContent =
        "[" + time + "] " + message;

    box.prepend(item);

    while(box.children.length > 50){

        box.removeChild(
            box.lastChild
        );
    }
}


/* =========================================================
   INITIAL
   ========================================================= */

addLog(
    "🚀 Device Dashboard loaded"
);

addLog(
    "🆔 Device ID: " + deviceId
);

addLog(
    "⏱️ Default Auto Send: 5 Seconds"
);


/* =========================================================
   START AUTO SEND
   ========================================================= */

/*
   চাইলে নিচের লাইনটি uncomment করে
   page খুললেই Auto Send চালু করতে পারো।
*/

// startAutoSend();


</script>

</body>
</html>
