<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Device Data</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:#1e293b;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
  text-align:center;
  margin-bottom:20px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

button:disabled{
  background:#475569;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#0f172a;
  word-break:break-word;
}

.data{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.item{
  background:#0f172a;
  padding:12px;
  border-radius:10px;
  overflow:hidden;
}

.label{
  color:#94a3b8;
  font-size:12px;
  margin-bottom:5px;
}

.value{
  font-size:14px;
  word-break:break-word;
}

.count{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-top:10px;
}

@media(max-width:600px){

  .data{
    grid-template-columns:1fr;
  }

  body{
    padding:10px;
  }

}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>📱 Device Data</h1>

    <button id="startBtn" onclick="startSystem()">
      Allow & Start
    </button>

    <button
      id="testBtn"
      onclick="sendTest()"
      disabled
    >
      TEST SEND
    </button>

    <div class="status" id="status">
      System stopped
    </div>

    <div class="count">
      <span id="count">0</span>
    </div>

    <div style="text-align:center;color:#94a3b8;">
      Data Sent
    </div>

  </div>


  <div class="card">

    <h2>Device Information</h2>

    <div class="data">

      <div class="item">
        <div class="label">IP Address</div>
        <div class="value" id="ip">Loading...</div>
      </div>

      <div class="item">
        <div class="label">Device</div>
        <div class="value" id="device">-</div>
      </div>

      <div class="item">
        <div class="label">OS</div>
        <div class="value" id="os">-</div>
      </div>

      <div class="item">
        <div class="label">Browser</div>
        <div class="value" id="browser">-</div>
      </div>

      <div class="item">
        <div class="label">Battery</div>
        <div class="value" id="battery">-</div>
      </div>

      <div class="item">
        <div class="label">Online</div>
        <div class="value" id="online">-</div>
      </div>

      <div class="item">
        <div class="label">Network</div>
        <div class="value" id="network">-</div>
      </div>

      <div class="item">
        <div class="label">Screen</div>
        <div class="value" id="screen">-</div>
      </div>

      <div class="item">
        <div class="label">Language</div>
        <div class="value" id="language">-</div>
      </div>

      <div class="item">
        <div class="label">Timezone</div>
        <div class="value" id="timezone">-</div>
      </div>

      <div class="item">
        <div class="label">Latitude</div>
        <div class="value" id="latitude">Waiting...</div>
      </div>

      <div class="item">
        <div class="label">Longitude</div>
        <div class="value" id="longitude">Waiting...</div>
      </div>

    </div>

  </div>

</div>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzFJbVAZxXgj1EdOo5LvIvBzJmyUDk4gE3f5GtG60Ayfaod1qbRRAKWCebOe_sxsKvJ/exec";


let locationData = {
  latitude:"",
  longitude:"",
  accuracy:""
};

let publicIP = "";

let batteryLevel = "";

let sendCount = 0;

let running = false;

let intervalID = null;


// ===============================
// PUBLIC IP
// ===============================

async function getIP(){

  try{

    const response =
      await fetch("https://api.ipify.org?format=json");

    const data = await response.json();

    publicIP = data.ip || "";

    document.getElementById("ip").textContent =
      publicIP || "Unavailable";

  }catch(error){

    publicIP = "";

    document.getElementById("ip").textContent =
      "Unavailable";

  }

}


// ===============================
// DEVICE
// ===============================

function getDevice(){

  const ua = navigator.userAgent.toLowerCase();

  if(/android/.test(ua)){
    return "Android";
  }

  if(/iphone/.test(ua)){
    return "iPhone";
  }

  if(/ipad/.test(ua)){
    return "iPad";
  }

  if(/windows/.test(ua)){
    return "Windows PC";
  }

  if(/macintosh/.test(ua)){
    return "Mac";
  }

  return "Unknown";

}


// ===============================
// OS
// ===============================

function getOS(){

  const ua = navigator.userAgent;

  if(/Android/i.test(ua))
    return "Android";

  if(/iPhone|iPad|iPod/i.test(ua))
    return "iOS";

  if(/Windows/i.test(ua))
    return "Windows";

  if(/Mac OS/i.test(ua))
    return "macOS";

  if(/Linux/i.test(ua))
    return "Linux";

  return "Unknown";

}


// ===============================
// BROWSER
// ===============================

function getBrowser(){

  const ua = navigator.userAgent;

  if(/Edg/i.test(ua))
    return "Microsoft Edge";

  if(/Chrome/i.test(ua) && !/Edg/i.test(ua))
    return "Chrome";

  if(/Firefox/i.test(ua))
    return "Firefox";

  if(/Safari/i.test(ua) && !/Chrome/i.test(ua))
    return "Safari";

  return "Unknown";

}


// ===============================
// NETWORK
// ===============================

function getNetwork(){

  const connection =
    navigator.connection ||
    navigator.mozConnection ||
    navigator.webkitConnection;

  if(!connection){

    return {
      type:"",
      speed:"",
      rtt:""
    };

  }

  return {

    type:
      connection.effectiveType || "",

    speed:
      connection.downlink
        ? connection.downlink + " Mbps"
        : "",

    rtt:
      connection.rtt
        ? connection.rtt + " ms"
        : ""

  };

}


// ===============================
// LOCATION
// ===============================

function startLocation(){

  if(!navigator.geolocation){

    document.getElementById("status").textContent =
      "Geolocation is not supported.";

    return;

  }


  navigator.geolocation.watchPosition(

    function(position){

      locationData.latitude =
        position.coords.latitude;

      locationData.longitude =
        position.coords.longitude;

      locationData.accuracy =
        position.coords.accuracy;


      document.getElementById("latitude").textContent =
        position.coords.latitude;

      document.getElementById("longitude").textContent =
        position.coords.longitude;

    },

    function(error){

      document.getElementById("latitude").textContent =
        "Permission denied";

      document.getElementById("longitude").textContent =
        "Permission denied";

    },

    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:10000
    }

  );

}


// ===============================
// BATTERY
// ===============================

async function getBattery(){

  try{

    if(navigator.getBattery){

      const battery =
        await navigator.getBattery();

      batteryLevel =
        Math.round(battery.level * 100) + "%";

      document.getElementById("battery").textContent =
        batteryLevel;


      battery.addEventListener(
        "levelchange",
        function(){

          batteryLevel =
            Math.round(battery.level * 100) + "%";

          document.getElementById("battery").textContent =
            batteryLevel;

        }
      );

    }

  }catch(error){

    batteryLevel = "";

    document.getElementById("battery").textContent =
      "Unavailable";

  }

}


// ===============================
// COLLECT DATA
// ===============================

function collectData(){

  const network = getNetwork();

  const date =
    new Date();

  const mapsLink =
    locationData.latitude &&
    locationData.longitude

    ?

    "https://www.google.com/maps?q=" +
    locationData.latitude +
    "," +
    locationData.longitude

    :

    "";


  return {

    dateTime:
      date.toISOString(),

    latitude:
      locationData.latitude,

    longitude:
      locationData.longitude,

    accuracy:
      locationData.accuracy,

    mapsLink:
      mapsLink,

    ip:
      publicIP,

    device:
      getDevice(),

    os:
      getOS(),

    browser:
      getBrowser(),

    battery:
      batteryLevel,

    online:
      navigator.onLine
        ? "Online"
        : "Offline",

    networkType:
      network.type,

    networkSpeed:
      network.speed,

    networkRtt:
      network.rtt,

    screen:
      window.screen.width +
      " x " +
      window.screen.height,

    language:
      navigator.language,

    timezone:
      Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone,

    platform:
      navigator.platform,

    userAgent:
      navigator.userAgent

  };

}


// ===============================
// SEND TO GOOGLE SHEET
// ===============================

async function sendData(){

  if(!running)
    return;


  const data =
    collectData();


  try{

    /*
      URLSearchParams ব্যবহার করছি।

      এতে Apps Script-এর
      e.parameter
      দিয়ে data পাওয়া যাবে।
    */

    const params =
      new URLSearchParams();


    Object.keys(data).forEach(
      function(key){

        params.append(
          key,
          data[key] ?? ""
        );

      }
    );


    await fetch(

      SCRIPT_URL,

      {

        method:"POST",

        mode:"no-cors",

        headers:{
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },

        body:params.toString()

      }

    );


    sendCount++;

    document.getElementById("count").textContent =
      sendCount;

    document.getElementById("status").textContent =
      "✅ Data sent — " +
      new Date().toLocaleTimeString();


  }catch(error){

    document.getElementById("status").textContent =
      "❌ Send error: " +
      error.message;

  }

}


// ===============================
// TEST SEND
// ===============================

async function sendTest(){

  document.getElementById("status").textContent =
    "Sending test...";


  const data =
    collectData();


  data.device =
    "TEST - " + data.device;


  try{

    const params =
      new URLSearchParams();


    Object.keys(data).forEach(
      function(key){

        params.append(
          key,
          data[key] ?? ""
        );

      }
    );


    await fetch(

      SCRIPT_URL,

      {

        method:"POST",

        mode:"no-cors",

        headers:{
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },

        body:params.toString()

      }

    );


    document.getElementById("status").textContent =
      "✅ TEST SEND completed. Check Google Sheet.";

  }catch(error){

    document.getElementById("status").textContent =
      "❌ TEST ERROR: " +
      error.message;

  }

}


// ===============================
// START
// ===============================

async function startSystem(){

  if(running)
    return;


  running = true;


  document.getElementById("startBtn").disabled =
    true;


  document.getElementById("testBtn").disabled =
    false;


  document.getElementById("status").textContent =
    "Starting...";


  document.getElementById("device").textContent =
    getDevice();

  document.getElementById("os").textContent =
    getOS();

  document.getElementById("browser").textContent =
    getBrowser();

  document.getElementById("online").textContent =
    navigator.onLine
      ? "Online"
      : "Offline";

  document.getElementById("screen").textContent =
    window.screen.width +
    " x " +
    window.screen.height;

  document.getElementById("language").textContent =
    navigator.language;

  document.getElementById("timezone").textContent =
    Intl.DateTimeFormat()
      .resolvedOptions()
      .timeZone;


  await getIP();

  await getBattery();

  startLocation();


  /*
    প্রথম data সঙ্গে সঙ্গে send হবে
  */

  await sendData();


  /*
    এরপর প্রতি 2 second
  */

  intervalID =
    setInterval(
      sendData,
      2000
    );


  document.getElementById("status").textContent =
    "🟢 System running — sending every 2 seconds.";

}


// ===============================
// ONLINE / OFFLINE
// ===============================

window.addEventListener(
  "online",
  function(){

    document.getElementById("online").textContent =
      "Online";

  }
);


window.addEventListener(
  "offline",
  function(){

    document.getElementById("online").textContent =
      "Offline";

  }
);

</script>

</body>

</html>
