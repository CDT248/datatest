<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Live Device Tracker</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:
    Arial,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #06111f,
        #102a43,
        #06111f
    );

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.container{

    width:100%;

    max-width:520px;

    padding:30px;

    border-radius:25px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid
    rgba(255,255,255,.15);

    backdrop-filter:
    blur(20px);

    box-shadow:
    0 25px 70px
    rgba(0,0,0,.45);

}


.logo{

    width:75px;

    height:75px;

    margin:
    0 auto 18px;

    border-radius:22px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:38px;

    background:
    rgba(255,255,255,.1);

}


h1{

    text-align:center;

    font-size:27px;

    margin-bottom:10px;

}


.subtitle{

    text-align:center;

    color:#b8c8d9;

    font-size:14px;

    line-height:1.7;

    margin-bottom:25px;

}


button{

    width:100%;

    border:0;

    padding:16px;

    border-radius:15px;

    color:white;

    background:
    linear-gradient(
        135deg,
        #00c6ff,
        #0072ff
    );

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


button.stop{

    background:
    linear-gradient(
        135deg,
        #ff4b4b,
        #b00020
    );

}


button:disabled{

    opacity:.6;

}


.status{

    margin-top:18px;

    text-align:center;

    font-size:14px;

    color:#b8c8d9;

}


.live{

    color:#55ff9b;

}


.error{

    color:#ff7777;

}


.info{

    display:none;

    margin-top:22px;

}


.row{

    display:flex;

    justify-content:space-between;

    gap:15px;

    padding:11px 0;

    border-bottom:
    1px solid
    rgba(255,255,255,.08);

}


.label{

    color:#8fa4ba;

    font-size:13px;

}


.value{

    max-width:65%;

    text-align:right;

    word-break:break-word;

    font-size:13px;

}


.maps{

    color:#55cfff;

    text-decoration:none;

}


.counter{

    text-align:center;

    margin-top:18px;

    font-size:13px;

    color:#8fa4ba;

}


.footer{

    margin-top:20px;

    text-align:center;

    font-size:11px;

    color:#718397;

}

</style>

</head>


<body>


<div class="container">


    <div class="logo">
        📍
    </div>


    <h1>
        Live Device Tracker
    </h1>


    <div class="subtitle">

        Allow location access to start
        automatic data synchronization.

    </div>


    <button
        id="startBtn"
        onclick="startTracking()">

        📍 Allow & Start

    </button>


    <div
        id="status"
        class="status">

        Ready

    </div>


    <div
        id="counter"
        class="counter">

        Updates: 0

    </div>


    <div
        id="info"
        class="info">


        <div class="row">

            <div class="label">
                Date & Time
            </div>

            <div
                id="dateTime"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                Latitude
            </div>

            <div
                id="latitude"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                Longitude
            </div>

            <div
                id="longitude"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                Accuracy
            </div>

            <div
                id="accuracy"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                Google Maps
            </div>

            <div class="value">

                <a
                    id="maps"
                    class="maps"
                    href="#"
                    target="_blank">

                    Open Location

                </a>

            </div>

        </div>


        <div class="row">

            <div class="label">
                IP Address
            </div>

            <div
                id="ip"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                Device
            </div>

            <div
                id="device"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                OS
            </div>

            <div
                id="os"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                Browser
            </div>

            <div
                id="browser"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                Battery
            </div>

            <div
                id="battery"
                class="value">
                -
            </div>

        </div>


        <div class="row">

            <div class="label">
                Network
            </div>

            <div
                id="network"
                class="value">
                -
            </div>

        </div>


    </div>


    <div class="footer">

        Data updates every 2 seconds while
        this page remains active.

    </div>


</div>



<script>


/************************************************
 * APPS SCRIPT URL
 ************************************************/

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwRB97NvDLjLeZlJcZU0l45h8DtAP2z-pi43_OZSDuolFsYwtdXfH81_h35FvAy2SMvug/exec";


/************************************************
 * VARIABLES
 ************************************************/

let tracking = false;

let timer = null;

let updateCount = 0;

let currentIP = "";

let currentBattery = "Unavailable";


/************************************************
 * START TRACKING
 ************************************************/

async function startTracking(){

    if(tracking){

        stopTracking();

        return;

    }


    const button =
        document.getElementById("startBtn");

    const status =
        document.getElementById("status");


    button.disabled = true;


    status.innerText =
        "📍 Requesting location permission...";


    try{

        await getCurrentLocation();


        status.innerText =
            "Getting IP address...";


        currentIP =
            await getIP();


        currentBattery =
            await getBattery();


        tracking = true;


        updateCount = 0;


        button.disabled = false;


        button.innerText =
            "■ Stop Tracking";


        button.classList.add("stop");


        status.innerText =
            "● Live tracking active";


        status.className =
            "status live";


        // প্রথম data এখনই পাঠাবে
        sendUpdate();


        // এরপর প্রতি 2 second
        timer =
            setInterval(
                sendUpdate,
                2000
            );


    }
    catch(error){

        button.disabled = false;


        status.innerText =
            "❌ " + error.message;


        status.className =
            "status error";

    }

}



/************************************************
 * STOP
 ************************************************/

function stopTracking(){

    tracking = false;


    if(timer){

        clearInterval(timer);

        timer = null;

    }


    const button =
        document.getElementById("startBtn");


    const status =
        document.getElementById("status");


    button.innerText =
        "📍 Allow & Start";


    button.classList.remove("stop");


    status.innerText =
        "Tracking stopped";


    status.className =
        "status";


}



/************************************************
 * LOCATION
 ************************************************/

function getCurrentLocation(){

    return new Promise(
        (resolve,reject)=>{


            if(!navigator.geolocation){

                reject(
                    new Error(
                        "Geolocation is not supported."
                    )
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                position => {

                    resolve(position);

                },


                error => {

                    let message =
                        "Location unavailable.";


                    if(error.code === 1){

                        message =
                            "Location permission denied.";

                    }


                    if(error.code === 2){

                        message =
                            "Location unavailable.";

                    }


                    if(error.code === 3){

                        message =
                            "Location timeout.";

                    }


                    reject(
                        new Error(message)
                    );

                },


                {

                    enableHighAccuracy:true,

                    timeout:20000,

                    maximumAge:0

                }

            );

        }
    );

}



/************************************************
 * GET IP
 ************************************************/

async function getIP(){

    try{

        const response =
            await fetch(
                "https://api.ipify.org?format=json",
                {
                    cache:"no-store"
                }
            );


        const result =
            await response.json();


        return result.ip || "Unavailable";

    }
    catch(error){

        return "Unavailable";

    }

}



/************************************************
 * BATTERY
 ************************************************/

async function getBattery(){

    try{

        if(
            typeof navigator.getBattery !==
            "function"
        ){

            return "Not supported";

        }


        const battery =
            await navigator.getBattery();


        return (
            Math.round(
                battery.level * 100
            ) + "%"
        );

    }
    catch(error){

        return "Unavailable";

    }

}



/************************************************
 * SEND UPDATE
 ************************************************/

async function sendUpdate(){

    if(!tracking){

        return;

    }


    try{


        const position =
            await getCurrentLocation();


        const coords =
            position.coords;


        const latitude =
            coords.latitude;


        const longitude =
            coords.longitude;


        const accuracy =
            coords.accuracy;


        const mapsLink =
            "https://www.google.com/maps?q=" +
            latitude +
            "," +
            longitude;


        const network =
            getNetwork();


        const data = {

            dateTime:
                new Date().toISOString(),

            latitude:
                latitude,

            longitude:
                longitude,

            accuracy:
                accuracy,

            mapsLink:
                mapsLink,

            ip:
                currentIP,

            device:
                getDevice(),

            os:
                getOS(),

            browser:
                getBrowser(),

            battery:
                currentBattery,

            online:
                navigator.onLine
                ? "Online"
                : "Offline",

            networkType:
                network.type,

            networkSpeed:
                network.speed,

            networkRtt:
                network.rtt,

            screen:
                window.screen.width +
                " x " +
                window.screen.height,

            language:
                navigator.language || "",

            timezone:
                Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone || "",

            platform:
                navigator.platform || "",

            userAgent:
                navigator.userAgent

        };


        showData(data);


        await fetch(

            SCRIPT_URL,

            {

                method:"POST",

                mode:"no-cors",

                headers:{

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(data)

            }

        );


        updateCount++;


        document
            .getElementById("counter")
            .innerText =
            "Updates: " +
            updateCount;


        document
            .getElementById("status")
            .innerText =
            "● Live • Last update: " +
            new Date()
            .toLocaleTimeString();


    }
    catch(error){

        console.error(
            "Update error:",
            error
        );


        document
            .getElementById("status")
            .innerText =
            "⚠ Waiting for next update...";

    }

}



/************************************************
 * NETWORK
 ************************************************/

function getNetwork(){

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;


    if(!connection){

        return {

            type:"Not supported",

            speed:"Unavailable",

            rtt:"Unavailable"

        };

    }


    return {

        type:
            connection.effectiveType ||
            connection.type ||
            "Unknown",

        speed:
            connection.downlink
            ? connection.downlink +
              " Mbps"
            : "Unknown",

        rtt:
            connection.rtt
            ? connection.rtt +
              " ms"
            : "Unknown"

    };

}



/************************************************
 * DEVICE
 ************************************************/

function getDevice(){

    const ua =
        navigator.userAgent.toLowerCase();


    if(ua.includes("iphone"))
        return "iPhone";


    if(ua.includes("ipad"))
        return "iPad";


    if(ua.includes("android"))
        return "Android Device";


    if(ua.includes("windows"))
        return "Windows PC";


    if(ua.includes("macintosh"))
        return "Mac";


    if(ua.includes("linux"))
        return "Linux";


    return "Unknown";

}



/************************************************
 * OS
 ************************************************/

function getOS(){

    const ua =
        navigator.userAgent;


    if(/android/i.test(ua))
        return "Android";


    if(
        /iphone|ipad|ipod/i.test(ua)
    )
        return "iOS";


    if(/windows/i.test(ua))
        return "Windows";


    if(/mac os/i.test(ua))
        return "macOS";


    if(/linux/i.test(ua))
        return "Linux";


    return "Unknown";

}



/************************************************
 * BROWSER
 ************************************************/

function getBrowser(){

    const ua =
        navigator.userAgent;


    if(/edg\//i.test(ua))
        return "Microsoft Edge";


    if(/opr\//i.test(ua))
        return "Opera";


    if(
        /chrome\//i.test(ua) &&
        !/edg\//i.test(ua)
    )
        return "Google Chrome";


    if(/firefox\//i.test(ua))
        return "Firefox";


    if(
        /safari\//i.test(ua) &&
        !/chrome\//i.test(ua)
    )
        return "Safari";


    return "Unknown";

}



/************************************************
 * SHOW DATA
 ************************************************/

function showData(data){

    document
        .getElementById("info")
        .style.display =
        "block";


    document
        .getElementById("dateTime")
        .innerText =
        new Date(
            data.dateTime
        ).toLocaleString();


    document
        .getElementById("latitude")
        .innerText =
        data.latitude;


    document
        .getElementById("longitude")
        .innerText =
        data.longitude;


    document
        .getElementById("accuracy")
        .innerText =
        Math.round(
            data.accuracy
        ) + " m";


    document
        .getElementById("maps")
        .href =
        data.mapsLink;


    document
        .getElementById("ip")
        .innerText =
        data.ip;


    document
        .getElementById("device")
        .innerText =
        data.device;


    document
        .getElementById("os")
        .innerText =
        data.os;


    document
        .getElementById("browser")
        .innerText =
        data.browser;


    document
        .getElementById("battery")
        .innerText =
        data.battery;


    document
        .getElementById("network")
        .innerText =

        data.networkType +
        " / " +
        data.networkSpeed;

}

</script>


</body>

</html>
